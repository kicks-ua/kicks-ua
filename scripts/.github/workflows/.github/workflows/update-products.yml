name: Update product stock from XML

on:
  schedule:
    # GitHub Actions использует UTC: 00:00, 04:00, 08:00, 12:00, 16:00 и 20:00 UTC
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-product-stock
  cancel-in-progress: false

jobs:
  update-stock:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install XML parser
        run: python -m pip install defusedxml

      - name: Update stock in products.json
        env:
          XML_URL: ${{ secrets.XML_URL }}
          # Оставьте false для обычного полного XML.
          # Если позднее решите обнулять остатки товаров, полностью пропавших из XML,
          # см. пояснение после кода.
          ZERO_STOCK_FOR_MISSING_PRODUCTS: "false"
        run: python scripts/update_product_stock.py

      - name: Commit and push products.json if changed
        env:
          GH_REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products.json

          if git diff --cached --quiet; then
            echo "No stock changes; products.json was not changed."
          else
            git commit -m "Update product stock from XML"
            git push origin "HEAD:${GH_REF_NAME}"
          fi
