<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">Товар — KICKS.UA</title>
  <meta id="metaDescription" name="description" content="Оригінальне взуття з доставкою по Україні">
  <meta id="ogTitle" property="og:title" content="KICKS.UA">
  <meta id="ogDescription" property="og:description" content="Оригінальне взуття з доставкою по Україні">
  <meta id="ogImage" property="og:image" content="">
  <meta property="og:type" content="product">
  <script type="application/ld+json" id="productSchema"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap');

    :root{
      --canvas:#EDE9E1;
      --asphalt:#232320;
      --sole:#8A8578;
      --cone:#FF4B12;
      --chalk:#FAF8F3;
      --stitch:#C9C2B2;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{
      background:var(--canvas);
      color:var(--asphalt);
      font-family:'Archivo',sans-serif;
      overflow-x:hidden;
    }
    a{color:inherit}

    .label{
      font-family:'JetBrains Mono',monospace;
      font-size:12px;
      letter-spacing:.12em;
      text-transform:uppercase;
      color:var(--sole);
    }

    nav{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:20px;
      padding:20px 6%;
      position:sticky;
      top:0;
      background:var(--canvas);
      z-index:50;
      border-bottom:2px solid var(--asphalt);
    }

    .logo{
      flex-shrink:0;
      font-family:'Archivo Black',sans-serif;
      font-size:21px;
      letter-spacing:-.02em;
      text-decoration:none;
      color:var(--asphalt);
    }
    .logo span{color:var(--cone)}

    .nav-links{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:10px;
      flex-wrap:wrap;
    }
    .nav-links a{
      font-family:'JetBrains Mono',monospace;
      font-size:13px;
      color:var(--asphalt);
      text-decoration:none;
    }

    .nav-link-text{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:9px 10px;
      border-bottom:1px solid transparent;
    }
    .nav-link-text:hover{border-bottom-color:var(--cone)}

    .nav-link-outline,
    .nav-link-pill{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:6px;
      padding:9px 13px;
      border:1.5px solid var(--asphalt);
      transition:background .15s,color .15s,transform .15s;
    }
    .nav-link-outline{background:transparent}
    .nav-link-pill{background:var(--chalk)}
    .nav-link-outline:hover,
    .nav-link-pill:hover{
      background:var(--asphalt);
      color:var(--chalk);
      transform:translateY(-1px);
    }

    .nav-cta{
      background:var(--cone);
      color:var(--chalk)!important;
      padding:11px 18px;
      font-weight:700;
      display:inline-flex;
      align-items:center;
      gap:6px;
      border:2px solid var(--asphalt);
      box-shadow:3px 3px 0 var(--asphalt);
      transition:transform .15s,box-shadow .15s,background .15s;
    }
    .nav-cta:hover{
      transform:translate(2px,2px);
      box-shadow:1px 1px 0 var(--asphalt);
      background:var(--asphalt);
    }

    .cart-badge{
      display:none;
      align-items:center;
      justify-content:center;
      background:var(--cone);
      color:var(--chalk);
      border-radius:50%;
      width:19px;
      height:19px;
      font:700 10.5px 'Archivo',sans-serif;
    }

    .promo-banner{
      background:var(--asphalt);
      color:var(--chalk);
      padding:10px 6%;
      display:flex;
      justify-content:center;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
      text-align:center;
      font:12.5px 'JetBrains Mono',monospace;
      letter-spacing:.04em;
    }
    .promo-banner .cone-text{color:var(--cone);font-weight:700}

    .banner-carousel{
      position:relative;
      display:none;
      margin:20px 6% 0;
      overflow:hidden;
      border:2px solid var(--asphalt);
      background:var(--canvas);
    }
    .banner-track{display:flex;transition:transform .5s ease}
    .banner-slide{
      display:block;
      position:relative;
      min-width:100%;
      aspect-ratio:16/5;
      text-decoration:none;
    }
    .banner-slide img{
      display:block;
      width:100%;
      height:100%;
      object-fit:cover;
    }
    .banner-title{
      position:absolute;
      right:0;
      bottom:0;
      left:0;
      padding:16px 20px;
      color:var(--chalk);
      background:linear-gradient(transparent,rgba(35,35,32,.85));
      font:clamp(16px,2.4vw,24px) 'Archivo Black',sans-serif;
    }
    .banner-dots{
      position:absolute;
      right:16px;
      bottom:10px;
      display:flex;
      gap:6px;
    }
    .banner-dots button{
      width:9px;
      height:9px;
      padding:0;
      border:1.5px solid var(--chalk);
      border-radius:50%;
      background:transparent;
      cursor:pointer;
    }
    .banner-dots button.active{background:var(--chalk)}

    .breadcrumb{
      padding:16px 6% 0;
      color:var(--sole);
      font:12px 'JetBrains Mono',monospace;
    }
    .breadcrumb a{
      color:var(--sole);
      text-decoration:none;
      border-bottom:1px solid var(--stitch);
    }

    .hero{
      display:grid;
      grid-template-columns:1fr 1.1fr;
      align-items:start;
      gap:36px;
      padding:30px 6% 46px;
    }

    .gallery-main{
      display:flex;
      align-items:center;
      justify-content:center;
      width:100%;
      aspect-ratio:1/1;
      margin-bottom:12px;
      padding:20px;
      overflow:hidden;
      background:#fff;
      border:2px solid var(--asphalt);
    }
    .gallery-main img{width:100%;height:100%;object-fit:contain}
    .gallery-main svg{width:100%;height:100%}

    .gallery-thumbs{
      display:grid;
      grid-template-columns:repeat(5,minmax(0,1fr));
      gap:8px;
    }
    .gallery-thumbs img{
      width:100%;
      aspect-ratio:1/1;
      object-fit:cover;
      background:#fff;
      border:1.5px solid var(--stitch);
      cursor:pointer;
    }
    .gallery-thumbs img:hover,
    .gallery-thumbs img.active{
      border:2px solid var(--cone);
    }

    h1.product-title{
      margin:12px 0 16px;
      font:clamp(26px,3.6vw,42px)/1.02 'Archivo Black',sans-serif;
      letter-spacing:-.02em;
    }
    .price-tag{
      display:inline-flex;
      align-items:baseline;
      gap:10px;
      margin-bottom:18px;
    }
    .price-tag .old{
      color:var(--sole);
      font:16px 'JetBrains Mono',monospace;
      text-decoration:line-through;
    }
    .price-tag .new{
      color:var(--cone);
      font:28px 'Archivo Black',sans-serif;
    }

    /* Сохраняет переносы из описания, чтобы текст не сливался в абзац. */
    .desc{
      margin-bottom:20px;
      color:#4a483f;
      font-size:15px;
      line-height:1.8;
      white-space:pre-line;
      overflow-wrap:anywhere;
    }

    .text-link{
      color:var(--cone);
      font-weight:600;
      text-decoration:underline;
      text-underline-offset:2px;
    }

    .specs{
      display:none;
      padding:18px 20px;
      margin-bottom:20px;
      background:var(--chalk);
      border:1.5px solid var(--stitch);
    }
    .specs.visible{display:block}
    .specs .row{
      display:flex;
      justify-content:space-between;
      gap:12px;
      padding:8px 0;
      border-bottom:1px solid var(--stitch);
      font-size:13.5px;
    }
    .specs .row:last-child{border-bottom:none}
    .specs .row .k{
      color:var(--sole);
      font:12px 'JetBrains Mono',monospace;
    }
    .specs .row .v{
      text-align:right;
      font-weight:600;
      overflow-wrap:anywhere;
    }

    .size-chart{
      display:none;
      padding:14px 18px;
      margin-bottom:22px;
      background:var(--canvas);
      border:1.5px dashed var(--stitch);
      color:#4a483f;
      font:12.5px 'JetBrains Mono',monospace;
      white-space:pre-line;
    }
    .size-chart.visible{display:block}

    .size-picker{margin-bottom:24px}
    .size-picker .label{
      display:block;
      margin-bottom:10px;
    }
    .size-grid{display:flex;flex-wrap:wrap;gap:8px}
    .size-grid button{
      min-width:52px;
      padding:11px 8px;
      border:2px solid var(--asphalt);
      background:var(--chalk);
      font:13.5px 'JetBrains Mono',monospace;
      cursor:pointer;
    }
    .size-grid button:hover,
    .size-grid button.active{
      background:var(--asphalt);
      color:var(--chalk);
    }

    .btn-primary{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      width:100%;
      margin-bottom:12px;
      padding:20px 24px;
      border:3px solid var(--asphalt);
      background:var(--cone);
      box-shadow:6px 6px 0 var(--asphalt);
      color:var(--chalk);
      text-align:center;
      text-decoration:none;
      font:700 15px 'JetBrains Mono',monospace;
      cursor:pointer;
      transition:transform .15s,box-shadow .15s;
    }
    .btn-primary:hover{
      transform:translate(3px,3px);
      box-shadow:3px 3px 0 var(--asphalt);
    }

    .btn-secondary{
      display:block;
      width:100%;
      padding:14px 24px;
      border:2px solid var(--asphalt);
      background:transparent;
      color:var(--asphalt);
      text-align:center;
      text-decoration:none;
      font:13.5px 'JetBrains Mono',monospace;
    }
    .btn-secondary:hover{
      background:var(--asphalt);
      color:var(--chalk);
    }

    .added-toast{
      display:none;
      padding:12px 18px;
      margin-bottom:18px;
      background:var(--asphalt);
      color:var(--chalk);
      font:13px 'JetBrains Mono',monospace;
    }
    .added-toast.visible{display:block}
    .added-toast a{color:var(--cone)}

    .trust-strip{
      display:flex;
      justify-content:space-between;
      gap:14px;
      flex-wrap:wrap;
      padding:18px 6%;
      background:var(--asphalt);
      color:var(--chalk);
    }
    .trust-strip div{
      display:flex;
      align-items:center;
      gap:8px;
      font:12.5px 'JetBrains Mono',monospace;
    }
    .trust-strip div::before{content:"—";color:var(--cone)}

    .lace-divider{
      height:24px;
      width:100%;
      background-image:repeating-linear-gradient(-55deg,var(--asphalt) 0,var(--asphalt) 3px,transparent 3px,transparent 22px);
      opacity:.85;
    }

    .related{padding:16px 6% 60px}
    .related h2{
      padding:30px 0 20px;
      font:22px 'Archivo Black',sans-serif;
    }
    .related-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
      gap:2px;
      background:var(--stitch);
      border-top:2px solid var(--asphalt);
      border-bottom:2px solid var(--asphalt);
    }
    .card{
      display:flex;
      flex-direction:column;
      padding:20px 18px 22px;
      background:var(--chalk);
      color:var(--asphalt);
      text-decoration:none;
    }
    .card:hover{background:#fff}
    .card .thumb{
      display:flex;
      align-items:center;
      justify-content:center;
      width:100%;
      aspect-ratio:1/1;
      padding:14px;
      margin-bottom:14px;
      overflow:hidden;
      background:var(--canvas);
      border:2px solid var(--asphalt);
    }
    .card .thumb img{width:100%;height:100%;object-fit:cover}
    .card .brand-tag{
      margin-bottom:4px;
      color:var(--sole);
      font:10.5px 'JetBrains Mono',monospace;
      letter-spacing:.05em;
      text-transform:uppercase;
    }
    .card h3{margin-bottom:6px;font-size:15.5px}
    .card .price{
      margin-top:auto;
      padding-top:8px;
      color:var(--cone);
      font:700 15.5px 'JetBrains Mono',monospace;
    }
    .card .price .old{
      margin-right:6px;
      color:var(--sole);
      font-size:12px;
      font-weight:400;
      text-decoration:line-through;
    }

    .not-found{padding:80px 6%;text-align:center}
    .not-found h2{
      margin-bottom:14px;
      font:28px 'Archivo Black',sans-serif;
    }

    footer{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
      padding:32px 6%;
      border-top:2px solid var(--asphalt);
    }
    footer .foot-links{
      display:flex;
      gap:20px;
      flex-wrap:wrap;
      font:12px 'JetBrains Mono',monospace;
    }
    footer .foot-links a{
      color:var(--asphalt);
      text-decoration:none;
      border-bottom:1px solid var(--stitch);
    }

    @media (max-width:760px){
      .hero{grid-template-columns:1fr}
      .trust-strip{flex-direction:column}
      nav{align-items:flex-start;flex-wrap:wrap}
      .nav-links{justify-content:flex-start}
    }
    @media (max-width:600px){
      .banner-slide{aspect-ratio:16/9}
      .gallery-thumbs{grid-template-columns:repeat(4,minmax(0,1fr))}
      .specs .row{align-items:flex-start}
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="logo">KICKS<span>.UA</span></a>
    <div class="nav-links" id="headerNav"></div>
  </nav>

  <div class="banner-carousel" id="bannerCarousel">
    <div class="banner-track" id="bannerTrack"></div>
    <div class="banner-dots" id="bannerDots"></div>
  </div>

  <div class="promo-banner">
    🔥 <span class="cone-text">Знижка тижня</span>
    <span>— до −16% на топ-моделі · оплата при отриманні · доставка по всій Україні</span>
  </div>

  <main id="pageContent">
    <div class="not-found"><h2>Завантаження...</h2></div>
  </main>

  <footer>
    <div class="logo">KICKS<span>.UA</span></div>
    <div class="foot-links" id="footerNav"></div>
  </footer>

  <script>
    const CART_KEY = 'kicksCart';
    const FAVORITES_KEY = 'kicksFavorites';
    let siteConfig = null;
    let bannerIndex = 0;
    let bannerTimer = null;

    function escapeHTML(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[char]);
    }

    function getJSONFromStorage(key) {
      try {
        const value = JSON.parse(localStorage.getItem(key) || '[]');
        return Array.isArray(value) ? value : [];
      } catch {
        return [];
      }
    }

    function updateBadges() {
      const cartBadge = document.getElementById('cartBadge');
      const favBadge = document.getElementById('favBadge');
      const cart = getJSONFromStorage(CART_KEY);
      const favorites = getJSONFromStorage(FAVORITES_KEY);

      if (cartBadge) {
        cartBadge.textContent = cart.length;
        cartBadge.style.display = cart.length ? 'inline-flex' : 'none';
      }
      if (favBadge) {
        favBadge.textContent = favorites.length;
        favBadge.style.display = favorites.length ? 'inline-flex' : 'none';
      }
    }

    function renderNavigation(config) {
      const nav = config?.navigation || {};
      const items = Array.isArray(nav.items) ? nav.items : [];
      const currentPage = 'product';

      const header = document.getElementById('headerNav');
      const footer = document.getElementById('footerNav');

      const visibleOnPage = item =>
        item.enabled !== false &&
        (!Array.isArray(item.pages) || item.pages.length === 0 || item.pages.includes(currentPage));

      const headerItems = items.filter(item =>
        visibleOnPage(item) &&
        Array.isArray(item.locations) &&
        item.locations.includes('header')
      );

      const footerItems = items.filter(item =>
        visibleOnPage(item) &&
        Array.isArray(item.locations) &&
        item.locations.includes('footer')
      );

      if (header) {
        header.innerHTML = headerItems.map(item => {
          const style = ['text', 'outline', 'pill'].includes(item.style) ? item.style : 'text';
          const classes = style === 'text' ? 'nav-link-text' : `nav-link-${style}`;
          let label = escapeHTML(item.label || '');

          if (item.id === 'cart' && item.showCartCount) {
            label += ' <span class="cart-badge" id="cartBadge">0</span>';
          } else if (item.id === 'favorites') {
            label += ' <span class="cart-badge" id="favBadge">0</span>';
          }

          const target = item.openInNewTab ? ' target="_blank" rel="noopener noreferrer"' : '';
          return `<a class="${classes}" href="${escapeHTML(item.url || '#')}"${target}>${label}</a>`;
        }).join('');

        const manager = nav.managerButton;
        if (manager && manager.enabled !== false) {
          const managerUrl = manager.url ||
            (config.contacts?.telegramHandle
              ? 'https://t.me/' + String(config.contacts.telegramHandle).replace(/^@/, '')
              : '#');
          const target = manager.openInNewTab === false ? '' : ' target="_blank" rel="noopener noreferrer"';

          header.insertAdjacentHTML(
            'beforeend',
            `<a class="nav-cta" href="${escapeHTML(managerUrl)}"${target}>${escapeHTML(manager.label || '💬 Написати нам')}</a>`
          );
        }
      }

      if (footer) {
        footer.innerHTML = footerItems.map(item => {
          let url = item.url || '#';
          if (item.id === 'telegram' && !url && config.contacts?.telegramHandle) {
            url = 'https://t.me/' + String(config.contacts.telegramHandle).replace(/^@/, '');
          }

          const target = item.openInNewTab ? ' target="_blank" rel="noopener noreferrer"' : '';
          return `<a href="${escapeHTML(url)}"${target}>${escapeHTML(item.label || '')}</a>`;
        }).join('');
      }

      updateBadges();
    }

    function productThumbHTML(product) {
      const images = Array.isArray(product.images) ? product.images : [];
      if (images.length) {
        return `<img src="${escapeHTML(images[0])}" alt="${escapeHTML(product.name || '')}">`;
      }

      return `
        <svg viewBox="0 0 500 320" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M40 230 Q30 180 90 165 Q110 120 170 110 Q230 95 280 115 L440 150 Q470 158 468 190 Q465 225 420 232 L70 245 Q45 245 40 230Z"
            fill="#EDE9E1" stroke="#232320" stroke-width="4"/>
          <path d="M40 230 Q60 250 100 248 L440 232 Q470 225 468 190"
            fill="#8A8578" stroke="#232320" stroke-width="4"/>
          <path d="M170 110 Q230 95 280 115 L320 150 L150 155Z"
            fill="#C9C2B2" stroke="#232320" stroke-width="4"/>
        </svg>`;
    }

    function applyTextLinksToElement(element, rules) {
      if (!element || !Array.isArray(rules) || !rules.length) return;

      const textNodes = [];
      const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT);

      while (walker.nextNode()) {
        const node = walker.currentNode;
        const parent = node.parentElement;

        if (!parent || parent.closest('a,button,script,style,textarea,input,select')) continue;
        textNodes.push(node);
      }

      const enabledRules = rules
        .filter(rule => rule.enabled !== false && rule.term && rule.url)
        .sort((a, b) => String(b.term).length - String(a.term).length);

      textNodes.forEach(node => {
        let remaining = node.nodeValue || '';
        if (!remaining) return;

        const fragment = document.createDocumentFragment();

        while (remaining) {
          let best = null;

          for (const rule of enabledRules) {
            const term = String(rule.term);
            const index = remaining.toLocaleLowerCase().indexOf(term.toLocaleLowerCase());

            if (index >= 0 && (!best || index < best.index)) {
              best = { rule, index, term };
            }
          }

          if (!best) {
            fragment.appendChild(document.createTextNode(remaining));
            break;
          }

          if (best.index > 0) {
            fragment.appendChild(
              document.createTextNode(remaining.slice(0, best.index))
            );
          }

          const matchedText = remaining.slice(best.index, best.index + best.term.length);
          const link = document.createElement('a');
          link.className = 'text-link';
          link.href = best.rule.url;
          link.textContent = matchedText;

          if (best.rule.openInNewTab) {
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
          }

          fragment.appendChild(link);
          remaining = remaining.slice(best.index + best.term.length);
        }

        node.parentNode.replaceChild(fragment, node);
      });
    }

    async function loadSiteConfig() {
      try {
        const response = await fetch('site-content.json?_=' + Date.now());
        if (!response.ok) throw new Error('HTTP ' + response.status);

        siteConfig = await response.json();
        renderNavigation(siteConfig);
        renderBanners(siteConfig);
      } catch (error) {
        console.warn('Не вдалося завантажити site-content.json:', error);
      }
    }

    function renderBanners(config) {
      const banners = (config?.banners || []).filter(banner =>
        banner.enabled !== false &&
        Array.isArray(banner.pages) &&
        banner.pages.includes('product')
      );

      const carousel = document.getElementById('bannerCarousel');
      const track = document.getElementById('bannerTrack');
      const dots = document.getElementById('bannerDots');

      if (!carousel || !track || !dots || !banners.length) return;

      track.innerHTML = banners.map(banner => {
        const image = `<img src="${escapeHTML(banner.imageUrl || '')}" alt="${escapeHTML(banner.title || '')}">`;
        const title = banner.title
          ? `<div class="banner-title">${escapeHTML(banner.title)}</div>`
          : '';
        const content = image + title;

        return banner.link
          ? `<a class="banner-slide" href="${escapeHTML(banner.link)}">${content}</a>`
          : `<div class="banner-slide">${content}</div>`;
      }).join('');

      if (banners.length > 1) {
        dots.innerHTML = banners.map((_, index) =>
          `<button type="button" aria-label="Банер ${index + 1}" class="${index === 0 ? 'active' : ''}" data-index="${index}"></button>`
        ).join('');

        dots.querySelectorAll('button').forEach(button => {
          button.addEventListener('click', () => {
            showBanner(Number(button.dataset.index), banners.length);
          });
        });

        bannerTimer = setInterval(() => {
          showBanner((bannerIndex + 1) % banners.length, banners.length);
        }, 5000);
      }

      carousel.style.display = 'block';
    }

    function showBanner(index, total) {
      bannerIndex = index;
      document.getElementById('bannerTrack').style.transform =
        `translateX(-${index * 100}%)`;

      document.querySelectorAll('#bannerDots button').forEach((button, i) => {
        button.classList.toggle('active', i === index);
      });
    }

    function updateProductMeta(product) {
      const title = `${product.brand || ''} ${product.name || ''}`.trim();
      document.getElementById('pageTitle').textContent = `${title} — KICKS.UA`;

      const description = String(product.description || `${title} — оригінальне взуття з доставкою по Україні.`)
        .replace(/\s+/g, ' ')
        .slice(0, 160);

      document.getElementById('metaDescription').content = description;
      document.getElementById('ogTitle').content = `${title} — KICKS.UA`;
      document.getElementById('ogDescription').content = description;

      const images = Array.isArray(product.images) ? product.images : [];
      if (images.length) {
        document.getElementById('ogImage').content =
          new URL(images[0], window.location.href).href;
      }

      document.getElementById('productSchema').textContent = JSON.stringify({
        '@context': 'https://schema.org/',
        '@type': 'Product',
        name: title,
        description,
        brand: {
          '@type': 'Brand',
          name: product.brand || ''
        },
        image: images.map(image => new URL(image, window.location.href).href),
        offers: {
          '@type': 'Offer',
          priceCurrency: 'UAH',
          price: product.price,
          availability: Number(product.stock) === 0
            ? 'https://schema.org/OutOfStock'
            : 'https://schema.org/InStock'
        }
      });
    }

    function renderProduct(product, products) {
      const page = document.getElementById('pageContent');
      const images = Array.isArray(product.images) ? product.images : [];
      const sizes = Array.isArray(product.sizes) ? product.sizes : [];
      const specs = product.specs && typeof product.specs === 'object'
        ? Object.entries(product.specs)
        : [];

      const galleryMain = images.length
        ? `<img id="mainImage" src="${escapeHTML(images[0])}" alt="${escapeHTML(product.name || '')}">`
        : productThumbHTML(product);

      const thumbnails = images.length > 1
        ? `<div class="gallery-thumbs" id="galleryThumbs">
             ${images.map((image, index) => `
               <img
                 src="${escapeHTML(image)}"
                 alt="${escapeHTML((product.name || 'Фото товару') + ' ' + (index + 1))}"
                 data-index="${index}"
                 class="${index === 0 ? 'active' : ''}"
               >
             `).join('')}
           </div>`
        : '';

      const oldPrice = product.oldPrice
        ? `<span class="old">${escapeHTML(product.oldPrice)} ₴</span>`
        : '';

      const specsHTML = specs.length
        ? `<div class="specs visible">
             ${specs.map(([key, value]) => `
               <div class="row">
                 <span class="k">${escapeHTML(key)}</span>
                 <span class="v">${escapeHTML(value)}</span>
               </div>
             `).join('')}
           </div>`
        : '';

      const sizeChartHTML = product.sizeChart
        ? `<div class="size-chart visible">
             <span class="label" style="display:block;margin-bottom:6px;">Розмірна сітка</span>
             <span id="sizeChartText"></span>
           </div>`
        : '';

      const sizesHTML = sizes.length
        ? sizes.map((size, index) => `
            <button type="button" class="size-btn ${index === 0 ? 'active' : ''}" data-size="${escapeHTML(size)}">
              ${escapeHTML(size)}
            </button>
          `).join('')
        : '<p class="label">Розміри уточнюйте у менеджера.</p>';

      page.innerHTML = `
        <div class="breadcrumb">
          <a href="index.html">Каталог</a>
          <span> / ${escapeHTML(product.brand || '')} ${escapeHTML(product.name || '')}</span>
        </div>

        <section class="hero">
          <div class="gallery">
            <div class="gallery-main">${galleryMain}</div>
            ${thumbnails}
          </div>

          <div class="hero-copy">
            <span class="label">${escapeHTML(product.brand || '')} · Оригінал</span>
            <h1 class="product-title">${escapeHTML(product.name || '')}</h1>

            <div class="price-tag">
              ${oldPrice}
              <span class="new">${escapeHTML(product.price)} ₴</span>
            </div>

            <p class="desc" id="productDescription"></p>

            ${specsHTML}
            ${sizeChartHTML}

            <div class="size-picker">
              <span class="label">Розмір (EU)</span>
              <div class="size-grid" id="sizeGrid">${sizesHTML}</div>
            </div>

            <div class="added-toast" id="addedToast">
              ✓ Додано в кошик —
              <a href="cart.html">перейти до кошика</a>
            </div>

            <div style="display:flex;gap:10px;margin-bottom:12px;">
              <button type="button" class="btn-primary" id="addToCartBtn" style="margin-bottom:0;flex:1;">
                🛒 ДОДАТИ В КОШИК
              </button>
              <button
                type="button"
                id="favToggleBtn"
                aria-label="Додати в обране"
                title="Додати в обране"
                style="width:60px;flex-shrink:0;border:3px solid var(--asphalt);background:var(--chalk);cursor:pointer;font-size:22px;"
              >♡</button>
            </div>

            <a href="cart.html" class="btn-secondary">Переглянути кошик →</a>
          </div>
        </section>

        <div class="lace-divider"></div>

        <div class="trust-strip">
          <div>Оригінал, документи від дистриб'ютора</div>
          <div>Оплата при отриманні</div>
          <div>Обмін розміру безкоштовно</div>
        </div>

        <section class="related">
          <h2>Схожі моделі</h2>
          <div class="related-grid" id="relatedGrid"></div>
        </section>
      `;

      // Вставляем описание как обычный текст, сохраняем переносы и эмодзи.
      const description = document.getElementById('productDescription');
      description.textContent = product.description || '';

      // Применяем настроенные в site-content.json ссылки к фразам описания.
      applyTextLinksToElement(description, siteConfig?.textLinks || []);

      const sizeChartText = document.getElementById('sizeChartText');
      if (sizeChartText) sizeChartText.textContent = product.sizeChart || '';

      if (images.length > 1) {
        document.querySelectorAll('#galleryThumbs img').forEach(thumb => {
          thumb.addEventListener('click', function () {
            document.querySelectorAll('#galleryThumbs img').forEach(item => {
              item.classList.remove('active');
            });
            this.classList.add('active');
            document.getElementById('mainImage').src = images[Number(this.dataset.index)];
          });
        });
      }

      let selectedSize = sizes[0] || '';

      document.querySelectorAll('.size-btn').forEach(button => {
        button.addEventListener('click', function () {
          document.querySelectorAll('.size-btn').forEach(item => item.classList.remove('active'));
          this.classList.add('active');
          selectedSize = this.dataset.size;
        });
      });

      document.getElementById('addToCartBtn').addEventListener('click', function () {
        const cart = getJSONFromStorage(CART_KEY);
        cart.push({
          productId: product.id,
          size: selectedSize,
          cartItemId: Date.now() + Math.random()
        });
        localStorage.setItem(CART_KEY, JSON.stringify(cart));

        const toast = document.getElementById('addedToast');
        toast.classList.add('visible');
        window.setTimeout(() => toast.classList.remove('visible'), 4000);
        updateBadges();
      });

      const favoriteButton = document.getElementById('favToggleBtn');

      function refreshFavoriteButton() {
        const favorites = getJSONFromStorage(FAVORITES_KEY);
        const active = favorites.includes(product.id);
        favoriteButton.textContent = active ? '♥' : '♡';
        favoriteButton.style.background = active ? 'var(--cone)' : 'var(--chalk)';
        favoriteButton.style.color = active ? 'var(--chalk)' : 'var(--asphalt)';
        favoriteButton.setAttribute(
          'aria-label',
          active ? 'Видалити з обраного' : 'Додати в обране'
        );
      }

      favoriteButton.addEventListener('click', function () {
        let favorites = getJSONFromStorage(FAVORITES_KEY);

        if (favorites.includes(product.id)) {
          favorites = favorites.filter(id => id !== product.id);
        } else {
          favorites.push(product.id);
        }

        localStorage.setItem(FAVORITES_KEY, JSON.stringify(favorites));
        refreshFavoriteButton();
        updateBadges();
      });

      refreshFavoriteButton();

      const related = products
        .filter(item => item.id !== product.id && item.active !== false)
        .slice(0, 3);

      const relatedGrid = document.getElementById('relatedGrid');

      if (!related.length) {
        relatedGrid.innerHTML = '<p class="label">Схожих моделей поки немає.</p>';
      } else {
        relatedGrid.innerHTML = related.map(item => `
          <a href="product.html?id=${encodeURIComponent(item.id)}" class="card">
            <div class="thumb">${productThumbHTML(item)}</div>
            <div class="brand-tag">${escapeHTML(item.brand || '')}</div>
            <h3>${escapeHTML(item.name || '')}</h3>
            <div class="price">
              ${item.oldPrice ? `<span class="old">${escapeHTML(item.oldPrice)} ₴</span>` : ''}
              ${escapeHTML(item.price)} ₴
            </div>
          </a>
        `).join('');
      }
    }

    async function initProductPage() {
      const page = document.getElementById('pageContent');
      const productId = new URLSearchParams(window.location.search).get('id');

      try {
        const [productsResponse, configResponse] = await Promise.all([
          fetch('products.json?_=' + Date.now()),
          fetch('site-content.json?_=' + Date.now()).catch(() => null)
        ]);

        if (!productsResponse.ok) {
          throw new Error('Не вдалося завантажити products.json');
        }

        const products = await productsResponse.json();

        if (configResponse && configResponse.ok) {
          siteConfig = await configResponse.json();
          renderNavigation(siteConfig);
          renderBanners(siteConfig);
        }

        const product = products.find(item => String(item.id) === String(productId));

        if (!product) {
          page.innerHTML = `
            <div class="not-found">
              <h2>Товар не знайдено</h2>
              <p style="color:var(--sole);margin-bottom:20px;">
                Можливо, він більше не доступний.
              </p>
              <a href="index.html" class="label">← Повернутись до каталогу</a>
            </div>`;
          return;
        }

        updateProductMeta(product);
        renderProduct(product, products);
      } catch (error) {
        page.innerHTML = `
          <div class="not-found">
            <h2>Помилка завантаження</h2>
            <p style="color:var(--sole);">${escapeHTML(error.message)}</p>
          </div>`;
      }
    }

    updateBadges();
    initProductPage();
  </script>
</body>
</html>
