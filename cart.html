<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кошик — KICKS.UA</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap');

    :root{
      --canvas:#EDE9E1;
      --asphalt:#232320;
      --sole:#8A8578;
      --cone:#FF4B12;
      --chalk:#FAF8F3;
      --stitch:#C9C2B2;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    body{
      background:var(--canvas);
      color:var(--asphalt);
      font-family:'Archivo',sans-serif;
      overflow-x:hidden;
    }

    a{color:inherit}
    .label{
      font-family:'JetBrains Mono',monospace;
      font-size:12px;
      letter-spacing:.12em;
      text-transform:uppercase;
      color:var(--sole);
    }

    nav{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:20px;
      padding:20px 6%;
      position:sticky;
      top:0;
      background:var(--canvas);
      z-index:50;
      border-bottom:2px solid var(--asphalt);
    }

    .logo{
      flex-shrink:0;
      font-family:'Archivo Black',sans-serif;
      font-size:21px;
      letter-spacing:-.02em;
      text-decoration:none;
      color:var(--asphalt);
    }
    .logo span{color:var(--cone)}

    .nav-links{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:10px;
      flex-wrap:wrap;
    }
    .nav-links a{
      font-family:'JetBrains Mono',monospace;
      font-size:13px;
      color:var(--asphalt);
      text-decoration:none;
    }

    .nav-link-text{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:9px 10px;
      border-bottom:1px solid transparent;
    }
    .nav-link-text:hover{border-bottom-color:var(--cone)}

    .nav-link-outline,
    .nav-link-pill{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:6px;
      padding:9px 13px;
      border:1.5px solid var(--asphalt);
      transition:background .15s,color .15s,transform .15s;
    }
    .nav-link-outline{background:transparent}
    .nav-link-pill{background:var(--chalk)}
    .nav-link-outline:hover,
    .nav-link-pill:hover{
      background:var(--asphalt);
      color:var(--chalk);
      transform:translateY(-1px);
    }

    .nav-cta{
      background:var(--cone);
      color:var(--chalk)!important;
      padding:11px 18px;
      font-weight:700;
      display:inline-flex;
      align-items:center;
      gap:6px;
      border:2px solid var(--asphalt);
      box-shadow:3px 3px 0 var(--asphalt);
      transition:transform .15s,box-shadow .15s,background .15s;
    }
    .nav-cta:hover{
      transform:translate(2px,2px);
      box-shadow:1px 1px 0 var(--asphalt);
      background:var(--asphalt);
    }

    .cart-badge{
      display:none;
      align-items:center;
      justify-content:center;
      background:var(--cone);
      color:var(--chalk);
      border-radius:50%;
      width:19px;
      height:19px;
      font:700 10.5px 'Archivo',sans-serif;
    }

    .banner-carousel{
      position:relative;
      display:none;
      margin:20px 6% 0;
      overflow:hidden;
      border:2px solid var(--asphalt);
      background:var(--canvas);
    }
    .banner-track{display:flex;transition:transform .5s ease}
    .banner-slide{
      display:block;
      position:relative;
      min-width:100%;
      aspect-ratio:16/5;
      text-decoration:none;
    }
    .banner-slide img{
      display:block;
      width:100%;
      height:100%;
      object-fit:cover;
    }
    .banner-title{
      position:absolute;
      right:0;
      bottom:0;
      left:0;
      padding:16px 20px;
      color:var(--chalk);
      background:linear-gradient(transparent,rgba(35,35,32,.85));
      font:clamp(16px,2.4vw,24px) 'Archivo Black',sans-serif;
    }
    .banner-dots{
      position:absolute;
      right:16px;
      bottom:10px;
      display:flex;
      gap:6px;
    }
    .banner-dots button{
      width:9px;
      height:9px;
      padding:0;
      border:1.5px solid var(--chalk);
      border-radius:50%;
      background:transparent;
      cursor:pointer;
    }
    .banner-dots button.active{background:var(--chalk)}

    .cart-page{
      padding:50px 6% 80px;
      max-width:760px;
    }

    .cart-page h1{
      font-family:'Archivo Black',sans-serif;
      font-size:clamp(30px,4.4vw,48px);
      letter-spacing:-.02em;
      line-height:1.02;
      margin-bottom:30px;
    }

    .cart-item{
      display:grid;
      grid-template-columns:90px 1fr auto;
      gap:18px;
      align-items:center;
      background:var(--chalk);
      border:2px solid var(--asphalt);
      padding:16px;
      margin-bottom:12px;
    }

    .cart-item .thumb{
      width:90px;
      height:90px;
      background:var(--canvas);
      border:1.5px solid var(--stitch);
      padding:8px;
    }
    .cart-item .thumb img, .cart-item .thumb svg{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .cart-item .info h3{
      font-size:16px;
      font-weight:700;
      margin-bottom:4px;
    }
    .cart-item .info .meta{
      font-family:'JetBrains Mono',monospace;
      font-size:12.5px;
      color:var(--sole);
    }

    .price-remove{
      text-align:right;
    }
    .cart-item .price{
      font-family:'JetBrains Mono',monospace;
      font-size:16px;
      color:var(--cone);
      font-weight:700;
      margin-bottom:6px;
    }
    .remove-btn{
      font-family:'JetBrains Mono',monospace;
      font-size:11.5px;
      color:var(--sole);
      background:none;
      border:none;
      text-decoration:underline;
      cursor:pointer;
      padding:0;
    }
    .remove-btn:hover{color:var(--cone)}

    .cart-total{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:20px 0;
      border-top:2px solid var(--asphalt);
      margin-top:20px;
    }
    .cart-total .label-total{
      font-family:'Archivo Black',sans-serif;
      font-size:18px;
    }
    .cart-total .sum{
      font-family:'Archivo Black',sans-serif;
      font-size:28px;
      color:var(--cone);
    }

    .empty-cart{
      background:var(--chalk);
      border:2px dashed var(--stitch);
      padding:50px 30px;
      text-align:center;
    }
    .empty-cart p{
      color:var(--sole);
      margin-bottom:20px;
      font-size:15px;
    }

    .btn-primary{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      width:100%;
      font-family:'JetBrains Mono',monospace;
      font-size:16px;
      font-weight:700;
      letter-spacing:.03em;
      background:var(--cone);
      color:var(--chalk);
      padding:20px 32px;
      text-decoration:none;
      border:3px solid var(--asphalt);
      box-shadow:6px 6px 0 var(--asphalt);
      transition:transform .15s,box-shadow .15s;
      cursor:pointer;
      text-align:center;
    }
    .btn-primary:hover{
      transform:translate(3px,3px);
      box-shadow:3px 3px 0 var(--asphalt);
    }

    .btn-outline{
      display:inline-block;
      font-family:'JetBrains Mono',monospace;
      font-size:13.5px;
      background:transparent;
      color:var(--asphalt);
      padding:14px 24px;
      text-decoration:none;
      border:2px solid var(--asphalt);
      margin-top:14px;
      text-align:center;
    }
    .btn-outline:hover{
      background:var(--asphalt);
      color:var(--chalk);
    }

    @media (max-width:600px){
      .cart-item{grid-template-columns:70px 1fr}
      .price-remove{grid-column:1 / -1;display:flex;justify-content:space-between;align-items:center}
      nav{align-items:flex-start;flex-wrap:wrap}
      .nav-links{justify-content:flex-start}
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="logo">KICKS<span>.UA</span></a>
    <div class="nav-links" id="headerNav"></div>
  </nav>

  <div class="banner-carousel" id="bannerCarousel">
    <div class="banner-track" id="bannerTrack"></div>
    <div class="banner-dots" id="bannerDots"></div>
  </div>

  <section class="cart-page">
    <h1>Кошик</h1>
    <div id="cartContent"><div class="label">Завантаження...</div></div>
  </section>

  <script>
    const CART_KEY = 'kicksCart';

    function getCart() {
      try {
        const items = JSON.parse(localStorage.getItem(CART_KEY) || '[]');
        return Array.isArray(items) ? items : [];
      } catch {
        return [];
      }
    }

    function setCart(cart) {
      localStorage.setItem(CART_KEY, JSON.stringify(cart));
    }

    function getJSONFromStorage(key) {
      try { return JSON.parse(localStorage.getItem(key) || '[]'); }
      catch { return []; }
    }

    function updateBadges() {
      const cart = getJSONFromStorage(CART_KEY);

      const cartBadges = document.querySelectorAll('#cartBadge');
      cartBadges.forEach(el => {
        el.textContent = cart.length;
        el.style.display = cart.length ? 'inline-flex' : 'none';
      });
    }

    function renderNavigation(config) {
      const nav = config?.navigation || {};
      const items = Array.isArray(nav.items) ? nav.items : [];
      const header = document.getElementById('headerNav');

      if (!header) return;

      const allowed = items.filter(item =>
        item.enabled !== false &&
        Array.isArray(item.locations) &&
        item.locations.includes('header')
      );

      header.innerHTML = allowed.map(item => {
        const label = item.id === 'favorites'
          ? `♥ Обране <span class="cart-badge" id="favBadge">0</span>`
          : item.id === 'cart'
            ? `Кошик <span class="cart-badge" id="cartBadge">0</span>`
            : item.label;

        const className = item.style === 'pill'
          ? 'nav-link-pill'
          : item.style === 'outline'
            ? 'nav-link-outline'
            : 'nav-link-text';

        const target = item.openInNewTab ? ' target="_blank" rel="noopener noreferrer"' : '';

        return `<a href="${item.url}" class="${className}"${target}>${label}</a>`;
      }).join('');

      if (nav.managerButton && nav.managerButton.enabled !== false) {
        const buttonUrl = nav.managerButton.url || '#';
        const target = nav.managerButton.openInNewTab ? ' target="_blank" rel="noopener noreferrer"' : '';
        header.insertAdjacentHTML(
          'beforeend',
          `<a class="nav-cta" href="${buttonUrl}"${target}>${nav.managerButton.label || '💬 Написати нам'}</a>`
        );
      }

      updateBadges();
    }

    function renderBanners(config) {
      const banners = (config?.banners || []).filter(banner =>
        banner.enabled !== false &&
        Array.isArray(banner.pages) &&
        banner.pages.includes('cart')
      );

      const carousel = document.getElementById('bannerCarousel');
      const track = document.getElementById('bannerTrack');
      const dots = document.getElementById('bannerDots');

      if (!carousel || !track || !dots || !banners.length) return;

      track.innerHTML = banners.map(banner => {
        const image = `<img src="${banner.imageUrl}" alt="${banner.title || ''}">`;
        const title = banner.title ? `<div class="banner-title">${banner.title}</div>` : '';
        const content = image + title;

        return banner.link
          ? `<a class="banner-slide" href="${banner.link}">${content}</a>`
          : `<div class="banner-slide">${content}</div>`;
      }).join('');

      if (banners.length > 1) {
        dots.innerHTML = banners.map((_, index) =>
          `<button type="button" class="${index === 0 ? 'active' : ''}" data-index="${index}"></button>`
        ).join('');

        dots.querySelectorAll('button').forEach(button => {
          button.addEventListener('click', () => {
            const index = Number(button.dataset.index);
            track.style.transform = `translateX(-${index * 100}%)`;
            dots.querySelectorAll('button').forEach((btn, i) => btn.classList.toggle('active', i === index));
          });
        });

        setInterval(() => {
          const current = Number(document.querySelector('.banner-dots button.active')?.dataset.index || 0);
          const next = (current + 1) % banners.length;
          track.style.transform = `translateX(-${next * 100}%)`;
          dots.querySelectorAll('button').forEach((btn, i) => btn.classList.toggle('active', i === next));
        }, 5000);
      }

      carousel.style.display = 'block';
    }

    function productThumbHTML(product) {
      if (product.images && product.images.length > 0) {
        return `<img src="${product.images[0]}" alt="${product.name}">`;
      }

      const body = product.placeholderColor?.body || '#EDE9E1';
      const accent = product.placeholderColor?.accent || '#8A8578';

      return `
        <svg viewBox="0 0 500 320" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="250" cy="290" rx="200" ry="16" fill="#232320" opacity="0.08"/>
          <path d="M40 230 Q30 180 90 165 Q110 120 170 110 Q230 95 280 115 L440 150 Q470 158 468 190 Q465 225 420 232 L70 245 Q45 245 40 230 Z"
            fill="${body}" stroke="#232320" stroke-width="4"/>
          <path d="M40 230 Q60 250 100 248 L440 232 Q470 225 468 190"
            fill="#8A8578" stroke="#232320" stroke-width="4"/>
          <path d="M170 110 Q230 95 280 115 L320 150 L150 155 Z"
            fill="${accent}" stroke="#232320" stroke-width="4"/>
        </svg>`;
    }

    async function renderCart() {
      const cart = getCart();
      const container = document.getElementById('cartContent');

      try {
        const res = await fetch('products.json?_=' + Date.now());
        const allProducts = await res.json();

        if (!cart.length) {
          container.innerHTML = `
            <div class="empty-cart">
              <p>Кошик поки порожній — додай товари з каталогу.</p>
              <a href="index.html" class="btn-outline">← До каталогу</a>
            </div>`;
          return;
        }

        let total = 0;
        let validCart = [];

        const itemsHtml = cart.map(item => {
          const product = allProducts.find(p => p.id === item.productId);
          if (!product) return null;

          validCart.push(item);
          total += product.price;

          return `
            <div class="cart-item">
              <div class="thumb">${productThumbHTML(product)}</div>
              <div class="info">
                <h3>${product.brand} ${product.name}</h3>
                <div class="meta">Розмір ${item.size}</div>
              </div>
              <div class="price-remove">
                <div class="price">${product.price} ₴</div>
                <button class="remove-btn" data-id="${item.cartItemId}">Видалити</button>
              </div>
            </div>
          `;
        }).filter(Boolean).join('');

        if (validCart.length !== cart.length) {
          setCart(validCart);
        }

        container.innerHTML = `
          ${itemsHtml}
          <div class="cart-total">
            <span class="label-total">Разом:</span>
            <span class="sum">${total} ₴</span>
          </div>
          <a href="order.html" class="btn-primary">ОФОРМИТИ ЗАМОВЛЕННЯ →</a>
          <a href="index.html" class="btn-outline" style="display:block;text-align:center;">← Продовжити покупки</a>
        `;

        container.querySelectorAll('.remove-btn').forEach(button => {
          button.addEventListener('click', function () {
            const nextCart = getCart().filter(item => item.cartItemId !== Number(this.dataset.id));
            setCart(nextCart);
            renderCart();
          });
        });
      } catch (err) {
        container.innerHTML = '<div class="label">Не вдалося завантажити дані товарів.</div>';
      }
    }

    async function init() {
      try {
        const res = await fetch('site-content.json?_=' + Date.now());
        const config = await res.json();

        renderNavigation(config);
        renderBanners(config);

        const managerButton = config?.navigation?.managerButton;
        if (managerButton && managerButton.url && managerButton.enabled !== false) {
          const managerAnchor = document.querySelector('.nav-cta');
          if (managerAnchor) managerAnchor.href = managerButton.url;
        }
      } catch (err) {
        console.warn('site-content.json не знайдено або не завантажений:', err);
      }

      updateBadges();
      renderCart();
    }

    init();
  </script>
</body>
</html>
